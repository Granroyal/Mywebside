name: Continuous Integration

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
      - html

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  structure:
    name: Check Project Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -d html
          test -f html/index.html
          test -d html/css
          test -d html/js

  lint:
    name: Lint HTML, CSS and JavaScript
    runs-on: ubuntu-latest
    needs: structure

    defaults:
      run:
        working-directory: html

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install linting tools
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard eslint

      - name: Lint HTML
        run: |
          htmlhint "**/*.html"

      - name: Lint CSS
        run: |
          echo '{ "extends": "stylelint-config-standard" }' > .stylelintrc.json
          stylelint "**/*.css"

      - name: Lint JavaScript
        run: |
          eslint "**/*.js" || true

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: html

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create temporary package file
        run: |
          npm init -y

      - name: Run npm audit
        run: |
          npm audit --audit-level=high || true