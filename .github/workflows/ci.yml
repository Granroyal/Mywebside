name: Continuous Integration

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
      - html

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  lint:
    name: Lint HTML, CSS and JavaScript
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: html

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install linting tools
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard eslint

      - name: Lint HTML
        run: |
          htmlhint "**/*.html"

      - name: Lint CSS
        run: |
          echo '{ "extends": "stylelint-config-standard" }' > .stylelintrc.json
          stylelint "**/*.css"

      - name: Lint JavaScript
        run: |
          eslint "**/*.js" || true