name: Continuous Integration

on:
    push:
        branches:
            - main
            - html
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    quality:
        name: Quality checks
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: Lint HTML
              run: npx htmlhint "index.html" "html/**/*.html"

            - name: Check local links and files
              run: npm run check:links

            - name: Check JavaScript syntax
              run: npm run check:js

            - name: Check formatting
              run: npm run format:check

